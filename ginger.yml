# semi-app —— 2026-08-02 从 sg.sola.day 迁到 homepod。
# 镜像仓库从 ghcr.io 换成自建的 yatch（home-registry.sola.day）。

service: semi-app
image: registry.sola.day/sola/semi-app

runner: nomad
egress: traefik

servers:
  web:
    hosts: [homepod.sola.day]
    primary: true

# 自建 registry（yatch）。2026-08-02 起不再经 ghcr。
registry:
  server: registry.sola.day
  username: sola
  password: YATCH_TOKEN

proxy:
  # 去掉了 app.ntdao.xyz —— 该域名已完全不解析（NXDOMAIN）。
  # Traefik 对一条路由的多个域名只签一张 SAN 证书，任何一个 HTTP-01 挑战失败
  # 整张证书都签不下来，留着它会连累 semi.im。
  # semi.ntdao.xyz 保留：它 CNAME 到 www.semi.im，会自动跟着迁过来。
  hosts: [semi.im, www.semi.im, semi.ntdao.xyz]
  app_port: 3000
  ssl: true
  health_check_path: /
  deploy_timeout: 90

ssh:
  user: ubuntu                # homepod 上 ubuntu 在 docker 组，且能直接调 Nomad

builder:
  arch: amd64
  remote: ssh://ubuntu@homepod

secrets:
  load: [.env.production]
  inject:
    - INSTANT_APP_ID
    - INSTANT_APP_ADMIN_TOKEN
    - OP_SOLA_BADGE_ADMIN_WALLET_PRIVATE_KEY
    - SEPOLIA_SOLA_BADGE_ADMIN_WALLET_PRIVATE_KEY
    - SOLA_BADGE_ADMIN_WALLET_PRIVATE_KEY
    - NUXT_PUBLIC_API_URL
    - VITE_API_URL
    - VITE_ALCHEMY_API_KEY
    - VITE_MAINNET_BUNDLER_URL
    - VITE_OP_BUNDLER_URL
    - VITE_SEPOLIA_BUNDLER_URL
    - VITE_OP_PAYMASTER
    - VITE_SOLA_AUTH_TOKEN
    - VITE_TOKEN_OWNER

retain_containers: 3
